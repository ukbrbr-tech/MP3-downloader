[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mp3dl"
version = "2.0.0"
description = "YouTube の再生リストから、まだ処理していない動画だけを mp3 として保存する個人用ツール"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "yt-dlp>=2024.1.1",
    "mutagen>=1.45",
    "pillow>=9.0",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
mp3dl = "mp3dl.cli:main"

[project.gui-scripts]
mp3dl-gui = "mp3dl.gui:run"

[tool.setuptools]
packages = ["mp3dl"]

[tool.setuptools.package-data]
mp3dl = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
